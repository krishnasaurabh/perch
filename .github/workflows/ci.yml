name: CI
on:
  push:
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:
    inputs:
      motion_isolation:
        description: Run a sandbox-only close-layer A/B experiment
        type: boolean
        default: false
      macos:
        description: Run the macOS job
        type: boolean
        default: true

# One run per branch; a new push cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-format:
    name: Swift format
    runs-on: ubuntu-24.04
    # Official Swift 6.4.2 image; pin the linux/amd64 image as well as the version.
    container:
      image: swift:6.4.2-noble@sha256:b7816e49fa73b2132ef9e598357c5c26ebc3b0e55390ded2295fda2486645b88
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Layout only: keep syntax-rewriting rules disabled in .swift-format.
      # To apply: git ls-files -z -- '*.swift' | xargs -0 swift format format --configuration .swift-format --in-place
      - name: Check pinned formatter and all tracked Swift files
        shell: bash
        run: |
          test "$(swift format --version)" = "6.4.2"
          git -c safe.directory="$GITHUB_WORKSPACE" ls-files -z -- '*.swift' | xargs -0 swift format lint --strict --no-color-diagnostics --configuration .swift-format

  core-linux:
    name: PlannerCore tests (Linux)
    needs: swift-format
    # The required Linux check must fail, not skip, if formatting fails.
    if: always()
    # GitHub-hosted runner. Never use a self-hosted runner on a public repo (fork PRs run code on it).
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful Swift formatting
        env:
          FORMAT_RESULT: ${{ needs.swift-format.result }}
        run: test "$FORMAT_RESULT" = success
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with: { swift-version: "6.2" }
      - name: Release and testing configuration regression
        run: python3 -m unittest discover -s scripts -p test_launch_configuration.py
      - name: Motion evidence classification regression
        run: python3 -m unittest discover -s scripts -p test_motion_evidence.py
      - name: Domain, MCP and portable UI tests
        run: |
          python3 -m unittest discover -s Tests/ArchitectureTests
          swift test
      - run: swift build -c release --product perch-cli
      - name: MCP end-to-end with the official Python SDK
        run: |
          pip install --quiet mcp
          PERCH_DATA=$RUNNER_TEMP/p.json TZ=America/Los_Angeles python scripts/mcp_smoke.py "$PWD/.build/release/perch-cli"

  changes:
    name: macOS path filter
    runs-on: ubuntu-24.04
    outputs:
      macos: ${{ steps.filter.outputs.macos }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select macOS jobs
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE_MACOS: ${{ inputs.macos }}
          PUSH_BASE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess
          if os.environ['EVENT_NAME'] == 'workflow_dispatch':
              macos = os.environ['FORCE_MACOS'] == 'true'
          else:
              base = os.environ['PR_BASE'] or os.environ['PUSH_BASE']
              if not base or set(base) == {'0'}:
                  macos = True  # New branch: no trustworthy base, so run all gates.
              else:
                  try:
                      paths = subprocess.check_output(['git', 'diff', '--no-renames', '--name-only', '-z', base, 'HEAD']).decode().split('\0')
                  except subprocess.CalledProcessError:
                      macos = True  # Rewritten/unavailable base: fail open to all tests.
                  else:
                      paths = [p for p in paths if p]
                      core_only = lambda p: p.startswith(('Sources/PlannerCore/', 'Sources/PerchMCP/', 'Tests/PlannerCoreTests/', 'Tests/PerchMCPTests/', 'Tests/PerchUITests/', 'Tests/PlannerTestSupport/')) or re.fullmatch(r'scripts/test_[^/]*\.py', p)
                      macos = not paths or not all(core_only(p) for p in paths)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'macos={str(macos).lower()}\n')
          print(f'Run macOS jobs: {macos}')
          PY

  app-macos:
    name: Perch.app (macOS)
    runs-on: macos-15
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          swift --version
      - name: Domain, MCP, UI logic and macOS app-layer tests
        run: |
          python3 -m unittest discover -s Tests/ArchitectureTests
          if ! swift test; then
            mkdir -p "$RUNNER_TEMP/native-diagnostics"
            # Preserve an actual native backtrace, rather than hiding a runner crash behind retries.
            lldb --batch -o 'settings set target.disable-aslr false' -o run -o 'thread backtrace all' -- \
              "$(xcrun --find xctest)" -XCTest 'PerchAppTests.RuntimeObservationTests/testStoreIdleDoesNotPublishOrDecodeEverySecond' \
              .build/debug/PerchPackageTests.xctest > "$RUNNER_TEMP/native-diagnostics/backtrace.txt" 2>&1 || true
            exit 1
          fi
      - name: Native failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-diagnostics
          path: ${{ runner.temp }}/native-diagnostics
          if-no-files-found: ignore
      - name: Build and smoke-test the distribution Release app
        run: |
          scripts/bundle.sh
          python3 scripts/check_release.py dist/Perch.app/Contents/MacOS/Perch "$RUNNER_TEMP/release-smoke"
      - name: Build instrumented probe app separately
        run: |
          PERCH_BUILD_VARIANT=testing scripts/bundle.sh
          python3 scripts/motion_build_manifest.py dist/testing/Perch.app
      - name: Undo persistence and timer regression
        run: bash scripts/check_undo.sh "$RUNNER_TEMP/undo"
      - name: External URL confirmation regression
        run: bash scripts/check_url_requests.sh "$RUNNER_TEMP/url-requests"
      - name: Archive app bundle
        # The sibling manifest binds motion evidence to this exact build.
        run: tar -czf "$RUNNER_TEMP/perch-app.tar.gz" -C dist/testing Perch.app motion-build.json
      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: perch-app-bundle
          path: ${{ runner.temp }}/perch-app.tar.gz
          if-no-files-found: error
      - name: App binary speaks MCP
        run: |
          pip3 install --quiet --break-system-packages mcp || pip3 install --quiet mcp
          PERCH_DATA=$RUNNER_TEMP/p.json python3 scripts/mcp_smoke.py "$PWD/dist/Perch.app/Contents/MacOS/Perch"
      - name: Focus survives an app crash without crediting offline time
        run: python3 scripts/focus_crash_check.py "$PWD/dist/Perch.app/Contents/MacOS/Perch" "$RUNNER_TEMP/focus-crash"
      - name: App launches and survives 5 s
        run: |
          PERCH_DATA=$RUNNER_TEMP/launch.json dist/Perch.app/Contents/MacOS/Perch &
          PID=$!; sleep 5
          kill -0 $PID && echo "still running" && kill $PID
      - name: Upload app package and crash evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Perch-package
          path: |
            dist/*.dmg
            ${{ runner.temp }}/focus-crash/
            ${{ runner.temp }}/url-requests/*.png
          if-no-files-found: error

  probes-layout-macos:
    name: Perch layout probes (macOS)
    runs-on: macos-15
    needs: app-macos
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          swift --version
      - name: Download app bundle
        uses: actions/download-artifact@v4
        with:
          name: perch-app-bundle
          path: ${{ runner.temp }}/perch-bundle
      - name: Restore app bundle
        run: |
          mkdir -p dist
          tar -xzf "$RUNNER_TEMP/perch-bundle/perch-app.tar.gz" -C dist
      - name: Screenshots (grey wallpaper so the notch outline shows)
        run: |
          python3 -c "import zlib,struct;w,h=64,64;raw=b''.join(b'\\x00'+bytes([120,124,135])*w for _ in range(h));c=lambda t,d:struct.pack('>I',len(d))+t+d+struct.pack('>I',zlib.crc32(t+d));open('/tmp/grey.png','wb').write(b'\\x89PNG\\r\\n\\x1a\\n'+c(b'IHDR',struct.pack('>IIBBBBB',w,h,8,2,0,0,0))+c(b'IDAT',zlib.compress(raw))+c(b'IEND',b''))"
          osascript -e 'tell application "System Events" to tell every desktop to set picture to "/tmp/grey.png"' || true
          sleep 2
          OUT=$RUNNER_TEMP/notch; mkdir -p $OUT
          # Closed-notch routing coverage explicitly opts into the external-display preference.
          printf '%s\n' '{"preferences":{"notchOnMonitors":true}}' > "$RUNNER_TEMP/shot.json"
          PERCH_DATA=$RUNNER_TEMP/shot.json dist/Perch.app/Contents/MacOS/Perch --preview-open --demo --dump-layout $OUT/live-open.json --snapshot $OUT &
          sleep 6; screencapture -x $RUNNER_TEMP/perch-open.png || true; kill %1 || true; sleep 1
          PERCH_DATA=$RUNNER_TEMP/shot.json dist/Perch.app/Contents/MacOS/Perch --dump-layout $OUT/live-closed.json --snapshot $OUT &
          sleep 5; screencapture -x $RUNNER_TEMP/perch-closed.png || true; kill %1 || true; sleep 1
          # A fresh profile must hide the closed synthetic notch but still open its workspace normally.
          rm -f $RUNNER_TEMP/default.json
          PERCH_DATA=$RUNNER_TEMP/default.json dist/Perch.app/Contents/MacOS/Perch --dump-layout $OUT/default-closed.json &
          sleep 5; kill %1 || true; sleep 1
          PERCH_DATA=$RUNNER_TEMP/default.json dist/Perch.app/Contents/MacOS/Perch --preview-open --demo --dump-layout $OUT/default-open.json &
          sleep 5; kill %1 || true
          ls -la $OUT $RUNNER_TEMP/perch-*.png
      - name: Home and Insights snapshots (empty, 3 tasks, timer running, insights)
        run: |
          for sc in empty:home three:home timer:home insights:insights empty:insights; do
            name=${sc%%:*}; page=${sc##*:}; OUT=$RUNNER_TEMP/notch/$name-$page; mkdir -p $OUT
            PERCH_DATA=$RUNNER_TEMP/sc-$name.json dist/Perch.app/Contents/MacOS/Perch --preview-open --scenario $name --page $page --snapshot $OUT &
            PID=$!; sleep 5; kill $PID || true; wait $PID 2>/dev/null || true
            ls $OUT/*.png || { echo "no snapshot for $name"; exit 1; }
          done
      - name: Home cards legibility (exact timer value, default and dot-matrix faces, heavy notepad)
        run: bash scripts/homecards_shots.sh "$RUNNER_TEMP/notch/homecards"
      - name: NotchLayout frames (fixtures + live) and mouse routing
        run: |
          OUT=$RUNNER_TEMP/notch
          NOTCH_LAYOUT_JSON=$OUT/fixtures.json swift test --filter NotchLayoutTests/testDumpFramesToJSON
          python3 - "$OUT" <<'EOF'
          import json, sys
          out = sys.argv[1]
          fx = json.load(open(f"{out}/fixtures.json")); print("fixtures:", [r["name"] for r in fx])
          want = {
              "closed": dict(notchCenterTopEdge=True, leftWing=True, justBelowShape=False, leftOfShape=False,
                             windowCornerOutsideShape=False, workspaceCenter=False, shapeTopCornerOutside=False, shapeTopInside=True),
              "open": dict(notchCenterTopEdge=True, workspaceCenter=True, justBelowShape=False, leftOfShape=False,
                           windowCornerOutsideShape=False, shapeTopCornerOutside=False, shapeTopInside=True),
          }
          bad = 0
          for state, exp in want.items():
              screens = json.load(open(f"{out}/live-{state}.json"))
              assert screens, f"no screens in live-{state}.json"
              for s in screens:
                  print(state, s["name"], "frame", s["frame"], "notch", s["notch"], "idle", s["idle"], "workspace", s["workspace"],
                        "window", s["window"], "visible", s["visible"], "attached", s.get("workspaceAttached"))
                  if not s["visible"]: continue
                  if state == "open" and not s["expanded"]: continue
                  exp = dict(exp, menuBarRight=False)
                  if state == "closed":
                      assert "timerCapsule" in s, "closed timer capsule missing from live layout"
                      exp.update(timerCapsuleCenter=True, timerGap=False)
                      pill, notch = s["timerCapsule"], s["notch"]
                      assert pill["w"] == 76, "timer capsule width changed"
                      gap = max(pill["x"] - notch["x"] - notch["w"], notch["x"] - pill["x"] - pill["w"])
                      assert abs(gap - 6) < 0.001, "timer capsule must be detached by 6pt"
                  if state == "open":
                      # Flat screen: the workspace floats below the menu bar, so the menu bar (incl. the strip above the
                      # notch and above the workspace's edge) clicks through. Beside a housing it hangs from the top.
                      att = s["workspaceAttached"]
                      exp.update(notchCenterTopEdge=att, menuBarAboveWorkspaceEdge=att)
                      bar = s["frame"]["y"] + s["frame"]["h"] - max(s["menuBarHeight"], 24)
                      top = s["workspace"]["y"] + s["workspace"]["h"]
                      if not att and top > bar - 8: print(f"  MENU BAR OVERLAP: workspace top {top} > {bar - 8}"); bad += 1
                  for k, v in exp.items():
                      if s["routing"][k] != v: print(f"  ROUTING MISMATCH {state} {k}: got {s['routing'][k]} want {v}"); bad += 1
                  assert s["window"]["y"] + s["window"]["h"] == s["frame"]["y"] + s["frame"]["h"], "window not flush with screen top"
          # Fresh defaults: no closed synthetic notch may draw or capture the menu bar, but explicit opening still works.
          for s in json.load(open(f"{out}/default-closed.json")):
              print("default closed", s["name"], "ignoresMouse", s["ignoresMouse"], "routing", s["routing"])
              assert not s["hardwareNotch"], "fresh-default probe requires a housing-less screen"
              if not s["ignoresMouse"]: print("  DEFAULT CLOSED WINDOW CAPTURES MENU BAR"); bad += 1
              for k, v in s["routing"].items():
                  if v: print(f"  DEFAULT CLOSED ROUTING {k}: got True want False"); bad += 1
          opened = json.load(open(f"{out}/default-open.json"))
          assert any(s["expanded"] for s in opened), "fresh-default workspace did not open"
          for s in opened:
              if not s["expanded"]: continue
              print("default open", s["name"], "workspace", s["workspace"], "routing", s["routing"])
              if not s["routing"]["workspaceCenter"]: print("  DEFAULT OPEN WORKSPACE NOT INTERACTIVE"); bad += 1
          sys.exit(1 if bad else 0)
          EOF
      - name: Theme contrast and Home Week Settings in both appearances
        run: |
          pip3 install --quiet --break-system-packages Pillow
          bash scripts/check_theme.sh "$RUNNER_TEMP/notch/theme"
      - name: Week with a busy today (overflow fade, +N more, pinned Add)
        run: bash scripts/week_shots.sh "$RUNNER_TEMP/notch/week"
      - name: Compact Home bounds and stress snapshots
        run: |
          bash scripts/check_compact_home.sh "$RUNNER_TEMP/notch/compact-home"
      - name: Larger flat desktop (best effort; the runner's virtual display defaults to 1024x768)
        run: |
          OUT=$RUNNER_TEMP/notch/large; mkdir -p $OUT
          brew install --quiet jakehilborn/jakehilborn/displayplacer >/dev/null 2>&1 || true
          if command -v displayplacer >/dev/null; then
            displayplacer list | tee $OUT/displayplacer-list.txt | head -40
            ID=$(displayplacer list | awk '/^Persistent screen id:/{print $4; exit}')
            for res in 1920x1080 1680x1050 1440x900 1280x1024 1280x800; do
              displayplacer "id:$ID res:$res scaling:off origin:(0,0) degree:0" 2>&1 | tail -2 && sleep 3
              system_profiler SPDisplaysDataType | grep -i resolution | tee $OUT/resolution.txt
              grep -q "${res%x*} x ${res#*x}" $OUT/resolution.txt && { echo "switched to $res"; break; }
            done
          fi
          PERCH_DATA=$RUNNER_TEMP/large.json dist/Perch.app/Contents/MacOS/Perch --preview-open --demo --dump-layout $OUT/live-open.json --snapshot $OUT &
          sleep 6; screencapture -x $RUNNER_TEMP/perch-open-large.png || true; kill %1 || true; sleep 1
          python3 - "$OUT" <<'EOF'
          import json, sys
          for s in json.load(open(f"{sys.argv[1]}/live-open.json")):
              print("large", s["name"], "frame", s["frame"], "workspace", s["workspace"], "attached", s["workspaceAttached"], "routing", s["routing"])
              if not s["expanded"] or s["workspaceAttached"]: continue
              bar = s["frame"]["y"] + s["frame"]["h"] - max(s["menuBarHeight"], 24)
              top = s["workspace"]["y"] + s["workspace"]["h"]
              assert top <= bar - 8, f"MENU BAR OVERLAP on {s['frame']}: workspace top {top} > {bar - 8}"
              assert not s["routing"]["menuBarRight"] and not s["routing"]["menuBarAboveWorkspaceEdge"], "menu bar must click through"
          EOF
      - name: Capture prompt contrast (rendered, resting + focused)
        run: bash scripts/check_capture_contrast.sh "$RUNNER_TEMP/capture-contrast"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Perch
          path: |
            ${{ runner.temp }}/perch-*.png
            ${{ runner.temp }}/notch/**
            ${{ runner.temp }}/capture-contrast/
          if-no-files-found: error

  probes-behavior-macos:
    name: Perch behavior probes (macOS)
    runs-on: macos-15
    needs: app-macos
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          swift --version
      - name: Download app bundle
        uses: actions/download-artifact@v4
        with:
          name: perch-app-bundle
          path: ${{ runner.temp }}/perch-bundle
      - name: Restore app bundle
        run: |
          mkdir -p dist
          tar -xzf "$RUNNER_TEMP/perch-bundle/perch-app.tar.gz" -C dist
      - name: Discoverable focus entry and real button lifecycle
        run: bash scripts/check_focus_entry.sh "$RUNNER_TEMP/notch/focus-entry"
      - name: Integrated store, repeats, clips and settings
        run: bash scripts/check_integration.sh "$RUNNER_TEMP/integration"
      - name: Recovery stays read-only with synthetic data
        run: bash scripts/check_recovery.sh "$RUNNER_TEMP/notch/recovery"
      - name: Reduced motion policy and nested transaction regression
        run: bash scripts/check_motion.sh "$RUNNER_TEMP/motion-policy"
      - name: Empty states and capture focus
        run: bash scripts/check_empty_states.sh "$RUNNER_TEMP/empty-states"
      - name: Clips layout (empty/populated, dark/light, pixel bounds)
        run: |
          pip3 install --quiet --break-system-packages Pillow || pip3 install --quiet Pillow
          python3 -m unittest discover -s scripts -p test_measure_clips_bounds.py
          bash scripts/check_clips_layout.sh "$RUNNER_TEMP/notch/clips"
      - name: Upload behavior evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Perch-behavior
          path: |
            ${{ runner.temp }}/notch/**
            ${{ runner.temp }}/empty-states/
            ${{ runner.temp }}/motion-policy/
            ${{ runner.temp }}/integration/
          if-no-files-found: error

  motion-macos:
    name: Perch motion evidence (macOS)
    runs-on: macos-15
    needs: app-macos
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          swift --version
      - name: Download app bundle
        uses: actions/download-artifact@v4
        with:
          name: perch-app-bundle
          path: ${{ runner.temp }}/perch-bundle
      - name: Restore app bundle
        run: |
          mkdir -p dist
          tar -xzf "$RUNNER_TEMP/perch-bundle/perch-app.tar.gz" -C dist
      - name: Motion capture (open, close, page, tick, timer)
        # Evidence only: never blocks a branch. Errors land in summary.md / capture.log inside the artifact.
        continue-on-error: true
        timeout-minutes: 12
        run: |
          for policy in production normal reduced; do
            PERCH_MOTION_POLICY=$policy scripts/motion_capture.sh "$RUNNER_TEMP/motion/$policy" dist/Perch.app || exit $?
          done
      - name: Motion driver missing-control negative
        run: bash scripts/check_motion_driver.sh "$PWD/dist/Perch.app/Contents/MacOS/Perch" "$RUNNER_TEMP/motion/negative"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perch-motion
          path: ${{ runner.temp }}/motion
          if-no-files-found: error

  isolate-close:
    if: github.event_name == 'workflow_dispatch' && inputs.motion_isolation
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
      - name: Baseline exact-source normal-policy recording
        run: |
          PERCH_BUILD_VARIANT=testing scripts/bundle.sh
          python3 scripts/motion_build_manifest.py dist/testing/Perch.app
          PERCH_MOTION_POLICY=normal scripts/motion_capture.sh "$RUNNER_TEMP/isolation/baseline" dist/testing/Perch.app
      - name: Sandbox-only layer-order experiment (never approval evidence)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Sources/PerchApp/Notch/NotchRootView.swift')
          s=p.read_text()
          old='WorkspaceView(notchHeight: g.notchSize.height)'
          assert s.count(old)==1
          p.write_text(s.replace(old, old+'\n                            .zIndex(1)'))
          PY
          mkdir -p "$RUNNER_TEMP/isolation"
          git diff > "$RUNNER_TEMP/isolation/EXPERIMENT.patch"
          PERCH_BUILD_VARIANT=testing scripts/bundle.sh
          # Invalidate the baseline manifest: the patched app is explicitly NOT exact-head evidence.
          rm -f dist/testing/motion-build.json
          PERCH_MOTION_POLICY=normal scripts/motion_capture.sh "$RUNNER_TEMP/isolation/raised-layer" dist/testing/Perch.app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: close-isolation-NOT-approval
          path: ${{ runner.temp }}/isolation
